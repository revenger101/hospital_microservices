spring.application.name=api-gateway-service

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Auto-create routes for any Eureka-registered service (in addition to the static routes below)
# NOTE: static routes below are configured for Spring Cloud Gateway Server WebMVC.
spring.cloud.gateway.discovery.locator.enabled=true

# JWT validation (must match Auth_Service and backend services)
app.jwt.issuer=hospital-auth
# IMPORTANT: change this in real usage
app.jwt.secret=change-me-to-a-long-random-secret-value

spring.cloud.gateway.server.webmvc.routes[0].id=patient-demo
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://patient-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/patient/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=doctor-demo
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://doctor-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/doctor/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=notification-demo
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/notification/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[3].id=appointment-demo
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://appointment-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/appointment/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[4].id=auth
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

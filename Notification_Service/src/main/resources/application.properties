spring.application.name=notification-service

server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT validation (must match Auth_Service and API gateway)
app.jwt.issuer=hospital-auth
app.jwt.secret=change-me-to-a-long-random-secret-value

# Local dev database (H2). If you want Postgres instead, replace these properties.
spring.datasource.url=jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
